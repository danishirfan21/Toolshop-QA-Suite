name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TOOLSHOP_REF: ae7caecb811dd8952c09d997e69be7cb946ecd44

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Self-hosted Toolshop (see the start step). The public demo is not used from CI because Cloudflare challenges runner IPs.
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8091
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: testsmith-io/practice-software-testing
          ref: ${{ env.TOOLSHOP_REF }}
          path: toolshop
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # The upstream web image is linux/arm64 only (run 40490758359: exec format error on amd64), so emulate it.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Start Toolshop (upstream prod compose)
        working-directory: toolshop
        run: docker compose -f docker-compose.prod.yml up -d laravel-api angular-ui web mariadb
      - name: Migrate and seed database
        working-directory: toolshop
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T laravel-api php artisan migrate:fresh --seed --force; then exit 0; fi
            echo "migrate attempt $i failed, retrying"; sleep 5
          done
          exit 1
      - name: Wait for API and web
        run: |
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/brands" || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/" || true)
            echo "api=$api web=$web"
            if [ "$api" = 200 ] && [ "$web" = 200 ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Toolshop logs on failure
        if: failure()
        working-directory: toolshop
        run: docker compose -f docker-compose.prod.yml logs --tail=100

      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: TEMP probe (lockout, rate limit, quantity 100)
        if: always()
        run: |
          # Bounded: 12 logins with a wrong password on the seeded customer, 80 GETs, 1 cart. Throwaway CI database.
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/login.out -w '%{http_code}' -X POST "$API_URL/users/login" -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"email":"customer@practicesoftwaretesting.com","password":"wrong-password"}')
            echo "login attempt $i: $code $(head -c 200 /tmp/login.out)"
          done
          code=$(curl -s -o /tmp/login.out -w '%{http_code}' -X POST "$API_URL/users/login" -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"email":"customer@practicesoftwaretesting.com","password":"welcome01"}')
          echo "login with the right password after failures: $code $(head -c 200 /tmp/login.out)"
          for i in $(seq 1 80); do
            curl -s -o /dev/null -D /tmp/h.out -w "get $i: %{http_code}\n" "$API_URL/brands"
            grep -i -E '^(x-ratelimit|retry-after)' /tmp/h.out | tr -d '\r' | tr '\n' ' ' | sed 's/^/  /;s/$/\n/' | grep -v '^\s*$' || true
          done | awk '{print} /get [0-9]+: 429/ {c++} END {print "429 count: " c+0}'
          cart=$(curl -s -X POST "$API_URL/carts" -H 'Accept: application/json' | jq -r .id)
          pid=$(curl -s "$API_URL/products" -H 'Accept: application/json' | jq -r '.data[0].id')
          code=$(curl -s -o /tmp/q.out -w '%{http_code}' -X POST "$API_URL/carts/$cart" -H 'Accept: application/json' -H 'Content-Type: application/json' -d "{\"product_id\":\"$pid\",\"quantity\":100}")
          echo "quantity 100 with JSON Accept: $code $(head -c 300 /tmp/q.out)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
